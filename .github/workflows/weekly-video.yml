name: Weekly video

# Runs the video pipeline from the private SathiyarajS/video-creator repository.
# This repository holds only the workflow and its settings. Nothing the run
# produces is stored on GitHub: finished files go to Azure Blob storage, and
# links arrive by Telegram and email.

on:
  schedule:
    # Saturday 09:00 IST (03:30 UTC).
    - cron: '30 3 * * 6'
  workflow_dispatch:
    inputs:
      build_teaser_short:
        description: 'Build the Short in addition to the main video'
        required: true
        type: boolean
        default: true
      person_override:
        description: 'Optional subject name (blank = next subject from the roster)'
        required: false
        type: string
        default: ''
      code_ref:
        description: 'video-creator branch, tag or commit to run'
        required: false
        type: string
        default: 'main'
      tests_only:
        description: 'Only check out, install and run the tests (no paid calls)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-video-run
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # A full run (script, ~50 images, TTS, render, Short) takes ~30-40 minutes.
    timeout-minutes: 120

    steps:
      - name: Check out the pipeline code
        uses: actions/checkout@v4
        with:
          repository: SathiyarajS/video-creator
          ref: ${{ inputs.code_ref || 'main' }}
          # Read-only deploy key for that one repository.
          ssh-key: ${{ secrets.VIDEO_CREATOR_DEPLOY_KEY }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: code/requirements.txt

      - name: Install system dependencies and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libsndfile1 libgomp1 fonts-roboto fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r code/requirements.txt

      # A broken commit must never reach the paid run.
      - name: Run the test suite
        env:
          TARGET_FOLDER: /tmp/video-tests
        run: python -m unittest discover -s tests

      - name: Run the video pipeline and upload to Azure
        if: ${{ !inputs.tests_only }}
        # Below the job limit, so the alert step still runs after a timeout.
        timeout-minutes: 110
        env:
          PYTHONUNBUFFERED: '1'
          TARGET_FOLDER: /tmp/video-output
          BUILD_TEASER_SHORT: ${{ inputs.build_teaser_short != false && 'true' || 'false' }}
          PERSON_OVERRIDE: ${{ inputs.person_override }}
          YOUTUBE_RETENTION_DAYS: '30'
          # Secrets: credentials and personal details.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          AZURE_TTS_KEY: ${{ secrets.AZURE_TTS_KEY }}
          AZURE_STORAGE_ACCOUNT_NAME: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          AZURE_STORAGE_ACCOUNT_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
          AZURE_STORAGE_CONTAINER_NAME: ${{ secrets.AZURE_STORAGE_CONTAINER_NAME }}
          AZURE_TABLE_CONNECTION_STRING: ${{ secrets.AZURE_TABLE_CONNECTION_STRING }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Variables: settings that are not secret. An unset one falls back
          # to the code default.
          AZURE_STORAGE_ALLOW_PUBLIC: ${{ vars.AZURE_STORAGE_ALLOW_PUBLIC }}
          AZURE_TTS_REGION: ${{ vars.AZURE_TTS_REGION }}
          AZURE_TTS_VOICE: ${{ vars.AZURE_TTS_VOICE }}
          SCRIPT_MODEL: ${{ vars.SCRIPT_MODEL }}
          UTILITY_MODEL: ${{ vars.UTILITY_MODEL }}
          LEDGER_MODEL: ${{ vars.LEDGER_MODEL }}
          ARC_MODEL: ${{ vars.ARC_MODEL }}
          NARRATION_MODEL: ${{ vars.NARRATION_MODEL }}
          EDITORIAL_MODEL: ${{ vars.EDITORIAL_MODEL }}
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY }}
          IMAGE_FALLBACK_MODELS: ${{ vars.IMAGE_FALLBACK_MODELS }}
          THUMBNAIL_FALLBACK_MODELS: ${{ vars.THUMBNAIL_FALLBACK_MODELS }}
          POLLINATIONS_MODEL: ${{ vars.POLLINATIONS_MODEL }}
          POLLINATIONS_REFERENCE_MODEL: ${{ vars.POLLINATIONS_REFERENCE_MODEL }}
          IMAGE_WORKERS: ${{ vars.IMAGE_WORKERS }}
        run: |
          mkdir -p /tmp/video-output
          python3 -m code.main

      - name: Alert on a failure the run could not report itself
        if: failure() || cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ ! -f /tmp/video-output/FAILURE_ALERTED ]; then
            python3 -m code.notify "weekly workflow" \
              "The run failed or timed out before it could report. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
